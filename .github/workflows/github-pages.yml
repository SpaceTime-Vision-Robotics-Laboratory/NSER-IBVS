name: Deploy Optimized Plain HTML Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Automatically compress images (JPG, PNG, SVG)
      - name: Compress Images
        uses: calibreapp/image-actions@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          compressOnly: true 

      # 2. Minify HTML, CSS, and JS to make the site load faster
      - name: Minify Source Code
        uses: docker://devatherock/minify-js:3.1.0
        with:
          directory: '.'
          add_suffix: false

      # 3. Setup Pages metadata
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 4. Upload the optimized files as an artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: . 

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4